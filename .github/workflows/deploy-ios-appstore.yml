name: Deploy iOS to App Store Connect

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'iOS Build Number (optional; defaults to run number)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

defaults:
  run:
    working-directory: mobile-expo

jobs:
  deploy:
    name: Build & Upload to App Store Connect
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: mobile-expo/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Stamp App Version and Build Number
        env:
          INPUT_BUILD_NUMBER: ${{ github.event.inputs.build_number }}
        run: |
          node -e "
            const fs = require('fs');
            const j = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            const ref = process.env.GITHUB_REF_NAME || '';
            if (ref.startsWith('v')) {
              j.expo.version = ref.replace(/^v/, '');
            }
            const runNum = process.env.INPUT_BUILD_NUMBER || process.env.GITHUB_RUN_NUMBER || '1';
            j.expo.ios = j.expo.ios || {};
            j.expo.ios.buildNumber = String(runNum);
            fs.writeFileSync('app.json', JSON.stringify(j, null, 2) + '\n');
            console.log('App Version:', j.expo.version, 'Build Number:', j.expo.ios.buildNumber);
          "

      - name: Install Apple Distribution Certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          node -e "
            const fs = require('fs');
            const path = require('path');
            let raw = (process.env.BUILD_CERTIFICATE_BASE64 || '').trim();
            raw = raw.replace(/^BUILD_CERTIFICATE_BASE64\s*=\s*/i, '');
            while (raw.startsWith('=')) raw = raw.slice(1).trim();
            raw = raw.replace(/^[\"']|[\"']$/g, '');
            raw = raw.replace(/\s+/g, '');

            const buf = Buffer.from(raw, 'base64');
            const certPath = path.join(process.env.RUNNER_TEMP, 'build_certificate.p12');
            fs.writeFileSync(certPath, buf);
            console.log('Decoded p12 size:', buf.length, 'Hex header:', buf.slice(0, 4).toString('hex'));
          "

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          CLEAN_PASS=$(printf '%s' "$P12_PASSWORD" | tr -d '\r\n')
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$CLEAN_PASS" -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Install Provisioning Profiles
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profiles/*.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
          cp profiles/DraftRewind_AppStore_Profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/833cf625-a225-4288-a388-d36f091a5e6f.mobileprovision
          cp profiles/DraftRewind_Widgets_AppStore_Profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/d2c98500-ecdd-462e-b7f7-681f7e1dc608.mobileprovision
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Generate Native iOS Project (Expo Prebuild)
        run: npx expo prebuild --platform ios --clean

      - name: Configure Signing & Entitlements in Xcode Project
        run: node scripts/configure-signing.js

      - name: Build Archive (Xcode)
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace ios/DraftRewind.xcworkspace \
            -scheme DraftRewind \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/DraftRewind.xcarchive \
            DEVELOPMENT_TEAM=U99V9TSK2X | tail -n 120

      - name: Export Signed IPA
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath build/DraftRewind.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/ipa | tail -n 100
          ls -lh build/ipa/

      - name: Upload IPA to App Store Connect
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo -e "$API_KEY_CONTENT" > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8

          IPA_PATH=$(find build/ipa -name "*.ipa" | head -n 1)
          echo "Uploading $IPA_PATH to App Store Connect..."

          xcrun altool --upload-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID" \
            --show-progress

      - name: Upload IPA Artifact to GitHub (Backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DraftRewind-AppStore-IPA
          path: mobile-expo/build/ipa/*.ipa
          retention-days: 14
