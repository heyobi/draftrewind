name: Deploy iOS to App Store Connect

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'iOS Build Number (optional; defaults to run number)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

defaults:
  run:
    working-directory: mobile-expo

jobs:
  deploy:
    name: Build & Upload to App Store Connect
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: mobile-expo/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Stamp App Version and Build Number
        env:
          INPUT_BUILD_NUMBER: ${{ github.event.inputs.build_number }}
        run: |
          node -e "
            const fs = require('fs');
            const j = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            const ref = process.env.GITHUB_REF_NAME || '';
            if (ref.startsWith('v')) {
              j.expo.version = ref.replace(/^v/, '');
            }
            const runNum = process.env.INPUT_BUILD_NUMBER || process.env.GITHUB_RUN_NUMBER || '1';
            j.expo.ios = j.expo.ios || {};
            j.expo.ios.buildNumber = String(runNum);
            fs.writeFileSync('app.json', JSON.stringify(j, null, 2) + '\n');
            console.log('App Version:', j.expo.version, 'Build Number:', j.expo.ios.buildNumber);
          "

      - name: Install Apple Distribution Certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Install Provisioning Profiles
        env:
          APP_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_APP_BASE64 }}
          WIDGET_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_WIDGET_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles

          echo -n "$APP_PROFILE_BASE64" | base64 --decode -o ~/Library/MobileDevice/Provisioning\ Profiles/app.mobileprovision
          echo -n "$WIDGET_PROFILE_BASE64" | base64 --decode -o ~/Library/MobileDevice/Provisioning\ Profiles/widget.mobileprovision

          # Extract UUIDs and rename files to UUID.mobileprovision
          for f in ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision; do
            UUID=$(grep -a -A1 '<key>UUID</key>' "$f" | grep -v '<key>' | sed -e 's/.*<string>//' -e 's/<\/string>.*//')
            if [ -n "$UUID" ]; then
              cp "$f" ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".mobileprovision
              echo "Installed profile UUID: $UUID"
            fi
          done

      - name: Generate Native iOS Project (Expo Prebuild)
        run: npx expo prebuild --platform ios --clean

      - name: Build Archive (Xcode)
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace ios/DraftRewind.xcworkspace \
            -scheme DraftRewind \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/DraftRewind.xcarchive \
            DEVELOPMENT_TEAM=U99V9TSK2X \
            CODE_SIGN_IDENTITY="Apple Distribution" | tail -n 120

      - name: Export Signed IPA
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath build/DraftRewind.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/ipa | tail -n 100
          ls -lh build/ipa/

      - name: Upload IPA to App Store Connect
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo -e "$API_KEY_CONTENT" > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8

          IPA_PATH=$(find build/ipa -name "*.ipa" | head -n 1)
          echo "Uploading $IPA_PATH to App Store Connect..."

          xcrun altool --upload-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID" \
            --show-progress

      - name: Upload IPA Artifact to GitHub (Backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DraftRewind-AppStore-IPA
          path: mobile-expo/build/ipa/*.ipa
          retention-days: 14
