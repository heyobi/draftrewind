name: Build iOS IPA

on:
  push:
    branches: [ main ]
    paths:
      - 'mobile-expo/**'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: mobile-expo

jobs:
  build:
    # Expo SDK 57 needs Xcode 26.4+; the macos-26 image defaults to a new enough Xcode.
    runs-on: macos-26

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Show Xcode
        run: |
          xcodebuild -version
          swift -version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: mobile-expo/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Check Expo config
        run: npx expo-doctor || true

      - name: Generate Native iOS Project (Expo Prebuild)
        run: npx expo prebuild --platform ios --clean

      - name: Build Archive for Physical Device (iphoneos)
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace ios/DraftRewind.xcworkspace \
            -scheme DraftRewind \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/DraftRewind.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" | tail -n 200

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -r build/DraftRewind.xcarchive/Products/Applications/DraftRewind.app Payload/
          test -f Payload/DraftRewind.app/main.jsbundle && echo "JS bundle embedded ✓"
          zip -qr DraftRewind-device.ipa Payload
          ls -lh DraftRewind-device.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DraftRewind-device-ipa
          path: mobile-expo/DraftRewind-device.ipa
          retention-days: 14
