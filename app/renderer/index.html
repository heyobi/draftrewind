<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://avatars.githubusercontent.com https://*.googleusercontent.com; font-src 'self' data:;">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DraftRewind</title>
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <header class="titlebar">
        <div class="brand">
            <img src="../assets/icon.png" alt="">
            <span>DraftRewind</span>
        </div>
        <div class="status-pill" id="status-pill" hidden></div>
    </header>

    <div class="shell">
        <aside class="rail" id="rail"></aside>
        <main class="main" id="main"></main>
    </div>

    <div id="modal-root"></div>
    <div class="toasts" id="toasts"></div>
    <canvas id="confetti"></canvas>

    <script src="../../node_modules/jszip/dist/jszip.min.js"></script>
    <script src="../../node_modules/docx-preview/dist/docx-preview.min.js"></script>
    <script src="../i18n/strings.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
